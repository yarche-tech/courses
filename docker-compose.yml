services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: courses
      POSTGRES_PASSWORD: courses
      POSTGRES_DB: courses
    ports:
      - "127.0.0.1:${COURSES_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${COURSES_REDIS_PORT:-6379}:6379"

volumes:
  pgdata: {}
